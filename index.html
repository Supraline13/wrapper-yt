<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bowling YT Wrapper</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    font-family: sans-serif;
    color: #fff;
  }
  #player {
    width: 100%;
    height: 100%;
  }
  #status {
    position: absolute;
    top: 6px;
    left: 8px;
    font-size: 11px;
    opacity: 0.6;
    pointer-events: none;
    text-shadow: 0 0 3px #000;
  }
</style>
</head>
<body>
  <div id="player"></div>
  <div id="status">init…</div>

<script>
  // ─── Lecture des paramètres d'URL ───
  const params  = new URLSearchParams(location.search);
  const videoId = params.get('v') || '';
  const start   = parseInt(params.get('t') || '0', 10) || 0;
  const vol     = Math.max(0, Math.min(100, parseInt(params.get('vol') || '100', 10)));

  const status = document.getElementById('status');
  function setStatus(s) { status.textContent = s; }

  if (!videoId) {
    setStatus('Pas de paramètre ?v=');
  } else {
    setStatus('Chargement YT API…');
  }

  // ─── Charge l'API IFrame YouTube ───
  let player;
  let unmuteAttempts = 0;
  const MAX_UNMUTE_ATTEMPTS = 20;

  const tag = document.createElement('script');
  tag.src = "https://www.youtube.com/iframe_api";
  document.head.appendChild(tag);

  // Fallback : un clic n'importe où force un démutage
  document.addEventListener('click', function () {
    if (player && player.unMute) {
      try { player.unMute(); player.setVolume(vol); player.playVideo(); } catch (_) {}
    }
  });

  function tryUnmute() {
    if (!player || !player.unMute) return;
    try {
      player.unMute();
      player.setVolume(vol);
      // Force play au cas où autoplay aurait été bloqué
      player.playVideo();

      const muted = player.isMuted ? player.isMuted() : true;
      if (muted && unmuteAttempts < MAX_UNMUTE_ATTEMPTS) {
        unmuteAttempts++;
        setTimeout(tryUnmute, 500);
        setStatus('Unmute retry #' + unmuteAttempts);
      } else {
        setStatus(muted ? '🔇 muted (autoplay bloqué)' : ('▶ ' + videoId + ' vol=' + vol));
      }
    } catch (err) {
      setStatus('unmute err: ' + err);
    }
  }

  window.onYouTubeIframeAPIReady = function () {
    if (!videoId) return;
    setStatus('Création player…');
    player = new YT.Player('player', {
      width: '100%',
      height: '100%',
      videoId: videoId,
      playerVars: {
        autoplay:        1,
        mute:            1,        // ← Démarre muet pour bypasser la policy autoplay
        controls:        0,
        disablekb:       1,
        fs:              0,
        modestbranding:  1,
        rel:             0,
        playsinline:     1,
        iv_load_policy:  3,
        start:           start
      },
      events: {
        onReady: function (e) {
          setStatus('Ready, play+unmute…');
          try {
            e.target.playVideo();
          } catch (_) {}
          setTimeout(tryUnmute, 250);
        },
        onError: function (e) {
          setStatus('YT error: ' + e.data);
        },
        onStateChange: function (e) {
          // 1=playing, 2=paused, 3=buffering, 5=cued, 0=ended, -1=unstarted
          if (e.data === YT.PlayerState.PLAYING) {
            // Une fois en lecture, on tente le démutage en boucle
            if (player.isMuted && player.isMuted()) tryUnmute();
          }
          if (e.data === YT.PlayerState.UNSTARTED || e.data === YT.PlayerState.CUED) {
            try { e.target.playVideo(); } catch (_) {}
          }
        }
      }
    });
  };
</script>
</body>
</html>
