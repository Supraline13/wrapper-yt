<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YT Wrapper</title>
<style>
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: #000;
    overflow: hidden;
    font-family: sans-serif;
    color: #fff;
  }
  #frame {
    width: 100%; height: 100%;
    border: 0;
    display: block;
  }
  #status {
    position: absolute;
    top: 6px; left: 8px;
    font-size: 11px;
    opacity: 0.6;
    pointer-events: none;
    text-shadow: 0 0 3px #000;
    z-index: 10;
  }
  #unmute-btn {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.6);
    color: #fff;
    border: 0;
    font-size: 22px;
    font-weight: bold;
    cursor: pointer;
    z-index: 5;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 8px;
  }
  #unmute-btn.show { display: flex; }
</style>
</head>
<body>
  <iframe id="frame"
          src="about:blank"
          allow="autoplay; encrypted-media; fullscreen"
          allowfullscreen></iframe>
  <button id="unmute-btn">
    🔊 ACTIVER LE SON
    <span style="font-size:13px;font-weight:normal;opacity:0.8;">cliquer pour démarrer la musique</span>
  </button>
  <div id="status">init…</div>

<script>
  const params  = new URLSearchParams(location.search);
  const videoId = params.get('v') || '';
  const start   = parseInt(params.get('t') || '0', 10) || 0;
  const vol     = Math.max(0, Math.min(100, parseInt(params.get('vol') || '100', 10)));

  const status = document.getElementById('status');
  const frame  = document.getElementById('frame');
  const btn    = document.getElementById('unmute-btn');
  const setStatus = s => status.textContent = s;

  if (!videoId) {
    setStatus('Pas de paramètre ?v=');
  } else {
    // Démarre toujours muet (autoplay garantie). On démutera ensuite via postMessage.
    const muted = vol === 0 ? 1 : 1;
    const url = `https://www.youtube-nocookie.com/embed/${videoId}` +
                `?autoplay=1&mute=${muted}&controls=0&disablekb=1&modestbranding=1` +
                `&rel=0&playsinline=1&iv_load_policy=3&fs=0&start=${start}` +
                `&enablejsapi=1&origin=${encodeURIComponent(location.origin)}`;
    frame.src = url;
    setStatus('▶ ' + videoId + ' (muet)');

    // Tente de démuter via postMessage de l'API IFrame YT
    function send(func, args) {
      try {
        frame.contentWindow.postMessage(JSON.stringify({
          event: 'command',
          func: func,
          args: args || []
        }), '*');
      } catch (_) {}
    }

    function tryUnmute(remaining) {
      if (vol === 0) { setStatus('▶ ' + videoId + ' (volume=0)'); return; }
      send('unMute');
      send('setVolume', [vol]);
      send('playVideo');
      setStatus('▶ ' + videoId + ' tentative démute (' + remaining + ')');
      if (remaining > 0) setTimeout(() => tryUnmute(remaining - 1), 600);
      else {
        // Si après 10 essais ça ne marche pas, montre le bouton de fallback
        btn.classList.add('show');
        setStatus('🔇 cliquer pour démuter');
      }
    }

    // Lance les tentatives après que l'iframe ait eu le temps de bind l'API
    setTimeout(() => tryUnmute(10), 1500);

    // Fallback : clic n'importe où démute
    function userInteract() {
      send('unMute');
      send('setVolume', [vol]);
      send('playVideo');
      btn.classList.remove('show');
      setStatus('▶ ' + videoId + ' vol=' + vol);
    }
    btn.addEventListener('click', userInteract);
    document.addEventListener('click', userInteract);
  }
</script>
</body>
</html>
