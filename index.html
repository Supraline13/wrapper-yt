<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bowling YT Wrapper</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    font-family: sans-serif;
    color: #fff;
  }
  #player {
    width: 100%;
    height: 100%;
  }
  #status {
    position: absolute;
    top: 8px;
    left: 8px;
    font-size: 11px;
    opacity: 0.5;
    pointer-events: none;
  }
</style>
</head>
<body>
  <div id="player"></div>
  <div id="status">init…</div>

<script>
  // ─── Lecture des paramètres d'URL ───
  const params  = new URLSearchParams(location.search);
  const videoId = params.get('v') || '';
  const start   = parseInt(params.get('t') || '0', 10) || 0;
  const vol     = Math.max(0, Math.min(100, parseInt(params.get('vol') || '100', 10)));

  const status = document.getElementById('status');
  function setStatus(s) { status.textContent = s; }

  if (!videoId) {
    setStatus('Pas de paramètre ?v=');
  } else {
    setStatus('Chargement YT API…');
  }

  // ─── Charge l'API IFrame YouTube ───
  let player;
  const tag = document.createElement('script');
  tag.src = "https://www.youtube.com/iframe_api";
  document.head.appendChild(tag);

  window.onYouTubeIframeAPIReady = function () {
    if (!videoId) return;
    setStatus('Création player…');
    player = new YT.Player('player', {
      width: '100%',
      height: '100%',
      videoId: videoId,
      playerVars: {
        autoplay:        1,
        controls:        0,
        disablekb:       1,
        fs:              0,
        modestbranding:  1,
        rel:             0,
        playsinline:     1,
        iv_load_policy:  3,
        start:           start
      },
      events: {
        onReady: function (e) {
          try {
            e.target.unMute();
            e.target.setVolume(vol);
            e.target.playVideo();
            setStatus('▶ ' + videoId);
          } catch (err) { setStatus('onReady err: ' + err); }
        },
        onError: function (e) {
          // Codes : 2=invalid, 5=html5, 100=removed, 101/150=embed-disabled, 153=origin
          setStatus('Erreur YT : ' + e.data);
        },
        onStateChange: function (e) {
          // -1=unstarted, 0=ended, 1=playing, 2=paused, 3=buffering, 5=cued
          if (e.data === YT.PlayerState.UNSTARTED || e.data === YT.PlayerState.CUED) {
            try { e.target.playVideo(); } catch (_) {}
          }
        }
      }
    });
  };
</script>
</body>
</html>
