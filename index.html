<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bowling Radio Wrapper</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    font-family: monospace;
    color: #0f0;
    font-size: 11px;
  }
  #s {
    position: absolute;
    top: 4px;
    left: 4px;
    opacity: 0.6;
    pointer-events: none;
  }
</style>
</head>
<body>
  <audio id="a" autoplay></audio>
  <div id="s">init…</div>

<script>
  // ─── Wrapper minimaliste pour streamer une radio en 3D ───
  //
  // Paramètres lus dans le FRAGMENT (#u=URL&vol=N) plutôt que dans la query :
  // navigation vers la même URL avec un fragment différent = same-document
  // navigation → événement 'hashchange', AUCUN reload de page → AUCUNE
  // coupure audio quand le joueur se déplace.
  //
  // Côté C# (RadioSpeakerHud.razor), Surface.Url est mis à jour à chaque
  // changement de volume effectif (quantifié par paliers de 5).

  var a = document.getElementById('a');
  var s = document.getElementById('s');
  var lastUrl = '';

  function apply() {
    var p = new URLSearchParams(location.hash.substring(1));
    var u = p.get('u') || '';
    var v = Math.max(0, Math.min(100, parseInt(p.get('vol') || '0', 10))) / 100;

    // Hors de portée ou pas d'URL → on coupe complètement le stream pour
    // pas consommer de bande passante.
    if (v <= 0 || !u) {
      if (lastUrl) {
        a.pause();
        a.removeAttribute('src');
        a.load();
        lastUrl = '';
      }
      s.textContent = 'muted';
      return;
    }

    // Nouveau flux → connecter
    if (u !== lastUrl) {
      a.src = u;
      lastUrl = u;
      a.play().catch(function (e) {
        s.textContent = 'play err: ' + e.message;
      });
    }

    a.volume = v;
    s.textContent = 'vol=' + Math.round(v * 100);
  }

  window.addEventListener('hashchange', apply);

  // L'autoplay Chromium est souvent bloqué tant qu'aucune "user gesture"
  // n'a eu lieu. Côté s&box, le HUD envoie un burst de TellMouseButton
  // post-load → ces clics arrivent ici, et ce handler retente .play().
  document.body.addEventListener('click', function () {
    if (a.paused && lastUrl) a.play().catch(function () {});
  });

  apply();
</script>
</body>
</html>
